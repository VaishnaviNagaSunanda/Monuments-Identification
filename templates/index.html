{% extends 'base.html' %}
{% load static %}

{% block contents %}
<style>
    /* Hero section specifically for index */
    .hero-container {
        height: calc(100vh - 80px); /* Fill screen minus navbar */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 20px;
        position: relative;
        z-index: 2;
    }

    .hero-text-box {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 4rem 3rem;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        max-width: 800px;
    }

    .main-title {
        font-family: 'Outfit', sans-serif;
        font-size: 4.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
        line-height: 1.1;
    }

    .subtitle {
        font-size: 1.25rem;
        color: #cbd5e1;
        font-weight: 300;
        margin-bottom: 2.5rem;
    }

    .cta-buttons {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
    }

    .btn-custom {
        padding: 0.8rem 2.5rem;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 12px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary-custom {
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: white;
        border: none;
        box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
    }

    .btn-primary-custom:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 25px -10px rgba(59, 130, 246, 0.7);
        color: white;
        text-decoration: none;
    }

    .btn-outline-custom {
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
    }

    .btn-outline-custom:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-3px);
        color: white;
        text-decoration: none;
    }

    @media (max-width: 768px) {
        .main-title {
            font-size: 2.8rem;
        }
        .hero-text-box {
            padding: 2.5rem 1.5rem;
            margin: 1rem;
        }
        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .cta-buttons {
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }
        .btn-custom {
            width: 100%;
            padding: 1rem;
        }
    }
    
    @media (max-width: 480px) {
        .main-title { font-size: 2.2rem; }
        .hero-container { padding: 0 10px; }
    }
</style>

<div class="hero-container">
    <div class="hero-text-box fade-in-element">
        <h1 class="main-title">Identify Landmarks Globally</h1>
        <p class="subtitle">AI-powered monument recognition. Upload an image, get immediate accurate history, 3D models and geographic data.</p>
        <div class="cta-buttons">
            <a href="{% url 'UserRegisterForm' %}" class="btn-custom btn-primary-custom">Get Started</a>
            <a href="{% url 'UserLogin' %}" class="btn-custom btn-outline-custom">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
