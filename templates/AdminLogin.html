{% extends 'base.html' %}
{% load static %}

{% block contents %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 120px);
        padding: 2rem 0;
    }

    .auth-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        padding: 3rem;
        max-width: 450px;
        width: 100%;
        position: relative;
        overflow: hidden;
    }

    /* Decorative top accent */
    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-title {
        font-family: 'Outfit', sans-serif;
        font-size: 2.2rem;
        font-weight: 700;
        color: white;
        margin-bottom: 0.5rem;
    }
    
    .auth-subtitle {
        color: #94a3b8;
        font-size: 0.95rem;
    }

    /* Toggle Switch */
    .toggle-container {
        display: flex;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        padding: 0.3rem;
        margin-bottom: 2rem;
        position: relative;
    }

    .toggle-btn {
        flex: 1;
        text-align: center;
        padding: 0.8rem;
        font-weight: 600;
        font-size: 0.95rem;
        color: #94a3b8;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 2;
        border-radius: 10px;
    }

    .toggle-btn.active {
        color: white;
    }

    .toggle-slider {
        position: absolute;
        top: 0.3rem;
        left: 0.3rem;
        width: calc(50% - 0.3rem);
        height: calc(100% - 0.6rem);
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        border-radius: 10px;
        transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        z-index: 1;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Forms */
    .auth-form {
        display: none;
        animation: fadeIn 0.4s ease forwards;
    }

    .auth-form.active {
        display: block;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        color: #e2e8f0;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }

    .form-control {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        color: white;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        outline: none;
        border-color: #3b82f6;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .form-control::placeholder {
        color: #64748b;
    }

    .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 1rem;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 1rem;
        box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px -10px rgba(59, 130, 246, 0.7);
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #94a3b8;
    }

    .auth-footer a {
        color: #60a5fa;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
    }

    .auth-footer a:hover {
        color: #93c5fd;
    }

    /* Messages */
    .messages-container {
        margin-bottom: 1.5rem;
    }
    .msg-alert {
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
        text-align: center;
        border: 1px solid;
    }
    .msg-alert.success {
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.3);
        color: #34d399;
    }
    .msg-alert.error {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #f87171;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="auth-container fade-in-element">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your account</p>
        </div>

        {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="msg-alert {% if message.tags == 'success' %}success{% else %}error{% endif %}">
                    <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %} mr-2"></i> {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="toggle-container">
            <div class="toggle-slider" id="toggleSlider" style="transform: translateX(100%);"></div>
            <div class="toggle-btn" id="btnUser" onclick="switchTab('user')">User Login</div>
            <div class="toggle-btn active" id="btnAdmin" onclick="switchTab('admin')">Admin Login</div>
        </div>

        <!-- User Login Form -->
        <form id="formUser" class="auth-form" action="{% url 'UserLoginCheck' %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Login ID</label>
                <input type="text" class="form-control" name="loginid" required placeholder="Enter Login ID">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="pswd" required placeholder="Enter Password">
            </div>
            <button class="submit-btn" type="submit">Sign In as User</button>
            <div class="auth-footer">
                Don't have an account? <a href="{% url 'UserRegisterForm' %}">Register now</a>
            </div>
        </form>

        <!-- Admin Login Form -->
        <form id="formAdmin" class="auth-form active" action="{% url 'AdminLogin' %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Admin ID</label>
                <input type="text" class="form-control" name="login_id" required placeholder="Enter Admin ID">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required placeholder="Enter Admin Password">
            </div>
            <button class="submit-btn" type="submit">Sign In as Admin</button>
        </form>
    </div>
</div>

<script>
    function switchTab(type) {
        const slider = document.getElementById('toggleSlider');
        const btnUser = document.getElementById('btnUser');
        const btnAdmin = document.getElementById('btnAdmin');
        const formUser = document.getElementById('formUser');
        const formAdmin = document.getElementById('formAdmin');

        if (type === 'user') {
            slider.style.transform = 'translateX(0)';
            btnUser.classList.add('active');
            btnAdmin.classList.remove('active');
            formUser.classList.add('active');
            formAdmin.classList.remove('active');
        } else {
            slider.style.transform = 'translateX(100%)';
            btnAdmin.classList.add('active');
            btnUser.classList.remove('active');
            formAdmin.classList.add('active');
            formUser.classList.remove('active');
        }
    }
</script>
{% endblock %}
