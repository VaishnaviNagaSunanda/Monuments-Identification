{% extends 'admins/adminbase.html'%}
{% block contents %}
<style>
    .admin-welcome {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 4rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        margin-top: 2rem;
    }

    .welcome-title {
        font-family: 'Outfit', sans-serif;
        font-size: 3rem;
        font-weight: 800;
        background: linear-gradient(135deg, #10b981, #3b82f6);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
    }

    @media (max-width: 992px) {
        .stats-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .welcome-section { padding: 2rem 1.5rem; }
        .welcome-title { font-size: 1.8rem; }
        .stats-grid {
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }
    }
    .admin-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 2.5rem;
        margin-top: 3.5rem;
    }

    .admin-card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 2.5rem;
        border-radius: 24px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        text-align: center;
        box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.5);
    }

    .admin-card:hover {
        transform: translateY(-10px);
        background: rgba(15, 23, 42, 0.95);
        border-color: #10b981;
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.4), 0 20px 40px -20px rgba(0, 0, 0, 0.8);
    }

    .card-icon {
        font-size: 2.8rem;
        color: #10b981;
        margin-bottom: 1.5rem;
        filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.3));
    }

    .card-title {
        color: white;
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.5px;
    }
</style>

<div class="admin-welcome fade-in-element">
    <h1 class="welcome-title">Admin Command Center</h1>
    <p class="text-secondary" style="font-size: 1.2rem;">Welcome back, Administrator. System status is optimal.</p>

    <div class="admin-stats">
        <div class="admin-card">
            <i class="fas fa-users card-icon"></i>
            <div class="card-title">User Management</div>
        </div>
        <div class="admin-card">
            <i class="fas fa-database card-icon"></i>
            <div class="card-title">Dataset Status</div>
        </div>
        <div class="admin-card">
            <i class="fas fa-server card-icon"></i>
            <div class="card-title">System Health</div>
        </div>
    </div>
</div>
{% endblock %}
